<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitMiner Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; }
    #map { height: 100vh; width: 100vw; }
    .legend {
      background: rgba(15,23,42,0.92);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      border: 1px solid #334155;
    }
    .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', {
      center: [39.9, 116.3],
      zoom: 13,
      zoomControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, CartoDB',
      maxZoom: 19
    }).addTo(map);

    var trajectoryLayer = L.layerGroup().addTo(map);
    var stayPointLayer  = L.layerGroup().addTo(map);

    var clusterColors = ['#38bdf8','#4ade80','#f59e0b','#c084fc','#f87171','#67e8f9'];

    // Called by Android WebView bridge
    function loadPoints(jsonStr) {
      trajectoryLayer.clearLayers();
      stayPointLayer.clearLayers();

      var data = JSON.parse(jsonStr);
      var gpsPoints = data.gps || [];
      var stayPoints = data.stay || [];

      if (gpsPoints.length === 0) return;

      // Draw trajectory line
      var latlngs = gpsPoints.map(function(p) { return [p.lat, p.lon]; });
      L.polyline(latlngs, { color: '#38bdf8', weight: 2.5, opacity: 0.7 }).addTo(trajectoryLayer);

      // Draw GPS dots (every 10th to avoid clutter)
      gpsPoints.filter(function(_, i) { return i % 10 === 0; }).forEach(function(p) {
        L.circleMarker([p.lat, p.lon], {
          radius: 2.5, color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.5, weight: 0
        }).addTo(trajectoryLayer);
      });

      // Draw stay point markers
      stayPoints.forEach(function(sp) {
        var color = clusterColors[sp.cluster % clusterColors.length] || '#ffffff';
        L.circleMarker([sp.lat, sp.lon], {
          radius: 14,
          color: color,
          fillColor: color,
          fillOpacity: 0.35,
          weight: 2.5
        })
        .bindPopup('<b>Place ' + sp.cluster + '</b><br>' + sp.label + '<br>Visits: ' + sp.visits)
        .addTo(stayPointLayer);
      });

      // Fit map to trajectory
      map.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });
    }

    // Default placeholder until Android loads data
    setTimeout(function() {
      if (trajectoryLayer.getLayers().length === 0) {
        L.marker([39.9, 116.3])
          .bindPopup('<b>HabitMiner</b><br>Start tracking to see your trajectory here!')
          .addTo(trajectoryLayer)
          .openPopup();
      }
    }, 500);
  </script>
</body>
</html>
